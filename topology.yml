# A topology definition for PV276 project sandboxes
name: pv276-2022-foxtrot

hosts:
  - name: attacker
    base_box:
      image: kali
      mgmt_user: debian
    flavor: csirtmu.tiny1x4

  - name: server
    base_box:
      image: ubuntu-18.04
      mgmt_user: ubuntu
    flavor: csirtmu.tiny1x2

  - name: user
    base_box:
      image: ubuntu-18.04
      mgmt_user: ubuntu
    flavor: csirtmu.tiny1x2

  - name: server2
    base_box:
      image: ubuntu-18.04
      mgmt_user: ubuntu
    flavor: csirtmu.tiny1x2

  - name: server3
    base_box:
      image: ubuntu-18.04
      mgmt_user: ubuntu
    flavor: csirtmu.tiny1x2

routers:
  - name: router
    base_box:
      image: debian-10-x86_64
      mgmt_user: debian
    flavor: csirtmu.tiny1x2

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: network
    cidr: 192.168.1.0/24

net_mappings:
  - host: server
    network: network
    ip: 192.168.1.4

  - host: attacker
    network: network
    ip: 192.168.1.30

  - host: user
    network: network
    ip: 192.168.1.19

  - host: server2
    network: network
    ip: 192.168.1.6

  - host: server3
    network: network
    ip: 192.168.1.3

router_mappings:
  - router: router
    network: network
    ip: 192.168.1.1

groups:
  - name: user-accessible
    nodes:
      - attacker
